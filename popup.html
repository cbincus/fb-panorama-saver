<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --accent: #1877f2;
    --text: #1c1e21;
    --muted: #65676b;
    --border: #d5d9de;
    --bg-soft: #f0f2f5;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 264px;
    padding: 14px 16px 16px;
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text);
    background: #fff;
  }
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
  }
  header img { width: 20px; height: 20px; }
  header h1 { font-size: 14px; font-weight: 600; }

  .field-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .segments {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 14px;
  }
  .segments button {
    flex: 1;
    padding: 7px 0;
    border: none;
    background: #fff;
    font: inherit;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
  }
  .segments button + button { border-left: 1px solid var(--border); }
  .segments button.active {
    background: var(--accent);
    color: #fff;
  }
  .segments button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }

  #quality-row { margin-bottom: 10px; }
  .quality-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }
  #quality-value {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    color: var(--accent);
  }
  input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
  }

  #hint {
    padding: 8px 10px;
    background: var(--bg-soft);
    border-radius: 8px;
    color: var(--muted);
    font-size: 12px;
  }
  .hidden { display: none; }
</style>
</head>
<body>
  <header>
    <img src="images/icon32.png" alt="">
    <h1>Save panorama as</h1>
  </header>

  <div class="field-label">Format</div>
  <div class="segments" role="radiogroup" aria-label="Image format">
    <button type="button" data-format="jpg">JPG</button>
    <button type="button" data-format="png">PNG</button>
    <button type="button" data-format="webp">WEBP</button>
  </div>

  <div id="quality-row">
    <div class="quality-head">
      <span class="field-label" style="margin:0">Quality</span>
      <span id="quality-value">92</span>
    </div>
    <input type="range" id="quality" min="50" max="100" step="1"
           aria-label="Image quality">
  </div>

  <div id="hint"></div>

  <script src="popup.js"></script>
</body>
</html>
